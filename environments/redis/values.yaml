appNamespace: redis-system

server:
  appName: redis-server
  replicaCount: 1
  image: redis
  imageTag: 8.6.5-alpine

  service:
    type: NodePort
    nodePort: 31087

  persistentVolume:
    storge: 1Gi
    accessModes: [ "ReadWriteOnce" ]

insight:
  appName: redis-insight
  replicaCount: 1
  image: redis/redisinsight
  imageTag: latest

  service:
    type: NodePort
    nodePort: 30087

  persistentVolume:
    storge: 1Gi
    accessModes: [ "ReadWriteOnce" ]