apiVersion: v1
kind: Service
metadata:
  name: redis-insight-svc
  namespace: {{ .Values.appNamespace }}
spec:
  type: {{ .Values.insight.service.type }}
  selector:
    app: {{ printf "%s-%s" .Values.insight.appName .Values.insight.imageTag }}
  ports:
    - port: 5540
      targetPort: 5540
      protocol: TCP
      name: tcp
      {{ if .Values.insight.service.nodePort }}
      nodePort: {{ .Values.insight.service.nodePort }}
      {{ end }}