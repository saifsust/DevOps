apiVersion: v1
kind: Service
metadata:
  name: redis-server-svc
  namespace: {{ .Values.appNamespace }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    app: {{ printf "%s-%s" .Values.server.appName .Values.server.imageTag}}
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
      {{ if .Values.server.service.nodePort }}
      nodePort: {{ .Values.server.service.nodePort }}
      {{ end }}